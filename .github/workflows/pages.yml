name: Docs (GitHub Pages)

# Builds the library and publishes docs/ to GitHub Pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
#
# Site layout mirrors the repo so the pages' relative paths (../dist/look.js)
# keep working both locally and on Pages:
#   _site/index.html  -> redirect to docs/
#   _site/docs/       -> docs/
#   _site/dist/       -> npm run build output
#   _site/images/     -> images/ (logo, favicons)

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'images/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'rollup.config.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r docs _site/docs
          cp -r dist _site/dist
          cp -r images _site/images
          touch _site/.nojekyll
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <title>LookUI</title>
            <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png" />
            <meta http-equiv="refresh" content="0; url=docs/" />
            <link rel="canonical" href="docs/" />
          </head>
          <body><a href="docs/">LookUI docs</a></body>
          </html>
          EOF

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
